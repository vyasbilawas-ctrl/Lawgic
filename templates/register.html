<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Lawgic</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Lora', serif; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { padding: 40px; border-radius: 12px; box-shadow: 0 12px 35px rgba(11, 37, 69, 0.12); width: 400px; border: none; }
        .brand { font-family: 'Cinzel', serif; color: #0b2545; font-weight: 800; font-size: 2rem; text-align: center; margin-bottom: 20px; text-decoration: none;}
        .btn-primary { background: #d4af37; border: none; color: #0b2545; font-weight: 600; }
        .btn-primary:hover { background: #b5952f; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="brand">Lawgic</a>
        <h4 class="text-center mb-4">Create an account</h4>
        <div id="msg" class="text-danger mb-3 text-center" style="display:none;"></div>
        <form id="form">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" style="color: #667085; text-decoration: none;">Already have an account? Login</a>
        </div>
    </div>
    <script>
        document.getElementById('form').onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            
            fetch('/register', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if(data.status === 'success') window.location.href = data.redirect;
                else { document.getElementById('msg').innerText = data.message; document.getElementById('msg').style.display = 'block'; }
            });
        };
    </script>
</body>
</html>
